[package]
name = "swe-md-parser"
version = "1.9.13"
edition = "2021"
license = "MIT"
rust-version = "1.98.1"
authors = ["SWE Engineering Labs"]
repository = "https://github.com/sweengineeringlabs/md-parser"
description = "Deterministic Markdown slide-deck parser and content-limit validator with zero external dependencies"
keywords = ["presentation", "markdown", "slides", "parsing", "validation"]
categories = ["text-processing"]
publish = true

[lib]
name = "md_parser"
path = "main/src/lib.rs"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package.metadata.arch]
application_type = "lib"
service_type = "presentation"
